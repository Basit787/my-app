# Docker's DNS, resolved per request so nginx starts before the apps
resolver 127.0.0.11 valid=10s ipv6=off;

# Uploads (images, documents, avatars)
client_max_body_size 100m;

# The host name's first label picks the container, on any domain (home.localhost, home.example.com)
map $host $app_upstream {
  hostnames;
  default       home:3000;
  home.*        home:3000;
  auth.*        auth:3001;
  links.*       link-shortener-frontend:3004;
  links-api.*   link-shortener-backend:3012;
  images.*      image-upload-frontend:3005;
  images-api.*  image-upload-backend:3006;
  summary.*     ai-summary-frontend:3007;
  summary-api.* ai-summary-backend:3008;
  chatbot.*     chatbot-frontend:3009;
  chatbot-api.* chatbot-backend:3010;
  invoices.*    invoice-frontend:3014;
  invoices-api.* invoice-backend:3013;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}
