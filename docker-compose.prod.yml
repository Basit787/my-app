name: my-project-prod

# Shared by every app: reused below with `<<: *app`
x-app: &app
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "nc -z 127.0.0.1 $$PORT"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 3m

# Shared backend environment: reused below with `<<: *backend-env`
x-backend-env: &backend-env
  AUTH_URL: http://auth:3001
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_REGION: ${S3_REGION}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  OLLAMA_URL: ${OLLAMA_URL}
  OLLAMA_MODEL: ${OLLAMA_MODEL}

# Shared frontend environment: reused below with `<<: *frontend-env`
x-frontend-env: &frontend-env
  AUTH_PROXY_TARGET: http://auth:3001

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  auth:
    <<: *app
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: prod
      args: { APP: "@chat/auth" }
    ports: ["3001:3001"]
    environment:
      <<: *backend-env
      PORT: "3001"
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/auth
    depends_on:
      postgres: { condition: service_healthy }

  link-shortener-backend:
    <<: *app
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: prod
      args: { APP: "@chat/link-shortener-backend" }
    ports: ["3012:3012"]
    environment:
      <<: *backend-env
      PORT: "3012"
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/link_shortener
    depends_on:
      postgres: { condition: service_healthy }
      auth: { condition: service_started }

  image-upload-backend:
    <<: *app
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: prod
      args: { APP: "@chat/image-upload-backend" }
    ports: ["3006:3006"]
    environment:
      <<: *backend-env
      PORT: "3006"
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/image_upload
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      auth: { condition: service_started }

  ai-summary-backend:
    <<: *app
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: prod
      args: { APP: "@chat/ai-summary-backend" }
    ports: ["3008:3008"]
    environment:
      <<: *backend-env
      PORT: "3008"
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/ai_summary
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      auth: { condition: service_started }

  chatbot-backend:
    <<: *app
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: prod
      args: { APP: "@chat/chatbot-backend", SYSTEM_PACKAGES: "poppler-utils" }
    ports: ["3010:3010"]
    environment:
      <<: *backend-env
      PORT: "3010"
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/chatbot
      VECTOR_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/chatbot_vectors
      SEARXNG_URL: ${SEARXNG_URL}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL}
      S3_BUCKET: chatbot
    depends_on:
      postgres: { condition: service_healthy }
      auth: { condition: service_started }

  invoice-backend:
    <<: *app
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: prod
      args:
        APP: "@chat/invoice-backend"
        SYSTEM_PACKAGES: "tesseract-ocr tesseract-ocr-data-eng poppler-utils fontconfig font-liberation"
    ports: ["3013:3013"]
    environment:
      <<: *backend-env
      PORT: "3013"
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/invoices
      OCR_LANGUAGES: ${OCR_LANGUAGES}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      auth: { condition: service_started }

  home:
    <<: *app
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: prod
      args: { APP: "@chat/home" }
    ports: ["3000:3000"]
    environment:
      <<: *frontend-env
      PORT: "3000"
    depends_on: [auth]

  link-shortener-frontend:
    <<: *app
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: prod
      args: { APP: "@chat/link-shortener-frontend" }
    ports: ["3004:3004"]
    environment:
      <<: *frontend-env
      PORT: "3004"
      API_PROXY_TARGET: http://link-shortener-backend:3012
    depends_on: [link-shortener-backend]

  image-upload-frontend:
    <<: *app
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: prod
      args: { APP: "@chat/image-upload-frontend" }
    ports: ["3005:3005"]
    environment:
      <<: *frontend-env
      PORT: "3005"
      API_PROXY_TARGET: http://image-upload-backend:3006
    depends_on: [image-upload-backend]

  ai-summary-frontend:
    <<: *app
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: prod
      args: { APP: "@chat/ai-summary-frontend" }
    ports: ["3007:3007"]
    environment:
      <<: *frontend-env
      PORT: "3007"
      API_PROXY_TARGET: http://ai-summary-backend:3008
    depends_on: [ai-summary-backend]

  chatbot-frontend:
    <<: *app
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: prod
      args: { APP: "@chat/chatbot-frontend" }
    ports: ["3009:3009"]
    environment:
      <<: *frontend-env
      PORT: "3009"
      API_PROXY_TARGET: http://chatbot-backend:3010
    depends_on: [chatbot-backend]

  invoice-frontend:
    <<: *app
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: prod
      args: { APP: "@chat/invoice-frontend" }
    ports: ["3014:3014"]
    environment:
      <<: *frontend-env
      PORT: "3014"
      API_PROXY_TARGET: http://invoice-backend:3013
    depends_on: [invoice-backend]

volumes:
  postgres_data:
  redis_data:
