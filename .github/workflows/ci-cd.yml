# Build, lint and test every push/PR; on main also push images to GHCR and deploy with Helm (kubernetes/README.md)
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Apps and packages: build, typecheck, lint, unit tests
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - run: pnpm turbo run typecheck lint
      - run: pnpm --filter "./apps/*-backend" --filter @chat/auth test

  # The Helm chart: lint and render with the default and the local values
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.0
      - run: helm lint kubernetes/helm/realtime
      - run: helm lint kubernetes/helm/realtime -f kubernetes/helm/realtime/values-local.yaml
      - run: helm template realtime-chat-app kubernetes/helm/realtime > /dev/null

  # Production image of every app, pushed as ghcr.io/<owner>/realtime-chat-app/<app>:<commit sha> and :latest
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [node, helm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app:
          - auth
          - home
          - link-shortener-backend
          - link-shortener-frontend
          - image-upload-backend
          - image-upload-frontend
          - ai-summary-backend
          - ai-summary-frontend
          - chatbot-backend
          - chatbot-frontend
    steps:
      - uses: actions/checkout@v7
      # Registry paths must be lowercase
      - run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/realtime-chat-app" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          # docker/frontend/Dockerfile for the web apps (home and *-frontend), docker/backend/Dockerfile for the APIs
          file: docker/${{ (matrix.app == 'home' || endsWith(matrix.app, '-frontend')) && 'frontend' || 'backend' }}/Dockerfile
          target: prod
          build-args: APP=@chat/${{ matrix.app }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.app }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Helm upgrade of the cluster to this commit's images. Turned on by the repository variable DEPLOY_ENABLED=true.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: images
    # A self-hosted runner on the machine that runs the cluster (local cluster), or a hosted runner with KUBE_CONFIG
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.0
      - name: Use the cluster credentials (secret KUBE_CONFIG, base64 kubeconfig) when set
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -n "$KUBE_CONFIG" ]; then
            mkdir -p "$HOME/.kube"
            echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
            chmod 600 "$HOME/.kube/config"
          fi
          kubectl cluster-info
      - name: Install or upgrade metrics-server (the autoscalers need it; set INSTALL_METRICS_SERVER=false if the cluster has one)
        if: vars.INSTALL_METRICS_SERVER != 'false'
        run: |
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/ --force-update
          helm upgrade --install metrics-server metrics-server/metrics-server --version 3.14.0 \
            --namespace kube-system -f kubernetes/metrics-server/values.yaml --wait
      - name: Install or upgrade the ingress-nginx controller
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx --force-update
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx --version 4.15.1 \
            --namespace ingress-nginx --create-namespace -f kubernetes/ingress-nginx/values.yaml --wait
      - name: Deploy the apps
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/realtime-chat-app"
          args=(
            --set "global.image.registry=${registry}"
            --set "global.image.tag=${GITHUB_SHA}"
            --set "global.domain=${{ vars.APP_DOMAIN || 'localtest.me' }}"
            --set "global.scheme=${{ vars.APP_SCHEME || 'http' }}"
            --set "seed.enabled=${{ vars.SEED_DEMO_DATA || 'false' }}"
          )
          # Secrets override the chart defaults only when they are set in the repository
          [ -n "$BETTER_AUTH_SECRET" ] && args+=(--set-string "secrets.betterAuthSecret=${BETTER_AUTH_SECRET}")
          [ -n "$POSTGRES_PASSWORD" ] && args+=(--set-string "secrets.postgresPassword=${POSTGRES_PASSWORD}")
          [ -n "$MINIO_ROOT_PASSWORD" ] && args+=(--set-string "secrets.minioRootPassword=${MINIO_ROOT_PASSWORD}")
          [ -n "$ADMIN_PASSWORD" ] && args+=(--set-string "secrets.adminPassword=${ADMIN_PASSWORD}")
          helm upgrade --install realtime-chat-app kubernetes/helm/realtime \
            --namespace realtime-chat-app --create-namespace "${args[@]}" --wait --timeout 20m
